name: Lean 4 Riemann Verification

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Lean 4
        uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Execute Lean 4 Kernel Validation
        run: lean Framework_RH.lean
