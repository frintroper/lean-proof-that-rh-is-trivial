name: Lean 4 & Jerk-SAT Verification

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Lean 4
        uses: leanprover/lean-action@v1
        with:
          build: false

      - name: Verify Bare Lean 4 Kernel
        run: lean Framework_RH.lean

      - name: Verify Jerk-SAT Continuous Relaxation Solver
        run: python3 test_jerk_sat.py
